name: Build KeepKey Desktop v3.2.0 Release

on:
  workflow_dispatch:
  push:
    branches:
      - release-3.2.0

jobs:
  build-release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout release-3.2.0 branch
        uses: actions/checkout@v4
        with:
          ref: release-3.2.0
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
            .yarn/cache
          key: ${{ runner.os }}-deps-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Install Dependencies
        run: yarn install

      - name: Build Application
        run: yarn build

      - name: Build Windows Packages
        if: startsWith(matrix.os, 'windows')
        run: |
          cd packages/keepkey-desktop
          yarn electron-builder --win --publish=never
        env:
          NODE_ENV: production

      - name: Build macOS Packages  
        if: startsWith(matrix.os, 'macos')
        run: |
          cd packages/keepkey-desktop
          yarn electron-builder --mac --publish=never
        env:
          NODE_ENV: production

      - name: Build Linux Packages
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          cd packages/keepkey-desktop
          yarn electron-builder --linux --publish always
        env:
          NODE_ENV: production
          GH_TOKEN: ${{ github.token }}

      - name: Upload Windows Artifacts
        if: startsWith(matrix.os, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            packages/keepkey-desktop/dist/*.exe
            packages/keepkey-desktop/dist/*.msi
            packages/keepkey-desktop/dist/*.exe.blockmap
            packages/keepkey-desktop/dist/*.msi.blockmap
          if-no-files-found: error

      - name: Upload macOS Artifacts
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            packages/keepkey-desktop/dist/*.dmg
            packages/keepkey-desktop/dist/*.zip
            packages/keepkey-desktop/dist/*.dmg.blockmap
          if-no-files-found: error

      - name: Upload Linux Artifacts
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            packages/keepkey-desktop/dist/*.deb
            packages/keepkey-desktop/dist/*.AppImage
            packages/keepkey-desktop/dist/*.deb.blockmap
            packages/keepkey-desktop/dist/*.AppImage.blockmap
          if-no-files-found: error

  create-and-upload-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release-3.2.0

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: ./dist

      - name: List Downloaded Files
        run: |
          echo "Downloaded packages:"
          ls -la ./dist/
          for file in ./dist/*; do
            echo "  $(basename $file) ($(du -h $file | cut -f1))"
          done

      - name: Create Release (if not exists) and Upload
        run: |
          # Create release if it doesn't exist
          if ! gh release view v3.2.0 --repo keepkey/keepkey-desktop &>/dev/null; then
            echo "Creating v3.2.0 release..."
            gh release create v3.2.0 \
              --title "KeepKey Desktop v3.2.0" \
              --notes "Release v3.2.0" \
              --target release-3.2.0 \
              --repo keepkey/keepkey-desktop
          fi

          # Upload all artifacts with proper names
          echo "Uploading artifacts to release..."
          for file in ./dist/*; do
            filename=$(basename "$file")
            echo "Uploading $filename..."
            gh release upload v3.2.0 "$file" --clobber --repo keepkey/keepkey-desktop
          done
        env:
          GH_TOKEN: ${{ github.token }}
